# /etc/apache2/sites-available/inventariomuni.conf
# Requiere: a2enmod ssl proxy proxy_http headers

<VirtualHost *:80>
    ServerName inventariomuni.smt.gob.ar
    Redirect permanent / https://inventariomuni.smt.gob.ar/
</VirtualHost>

<VirtualHost *:443>
    ServerName inventariomuni.smt.gob.ar

    SSLEngine on
    SSLCertificateFile    /ruta/al/certificado.crt
    SSLCertificateKeyFile /ruta/a/la/clave.key

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    RequestHeader set X-Forwarded-Proto "https"

    # Fotos de hasta 12 MB por archivo; 20 MB por envío.
    LimitRequestBody 20971520

    ErrorLog  ${APACHE_LOG_DIR}/inventariomuni_error.log
    CustomLog ${APACHE_LOG_DIR}/inventariomuni_access.log combined
</VirtualHost>
